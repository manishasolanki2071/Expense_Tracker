<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center">
    <div class="w-full xl:mx-40 xl:my-20 p-10 flex flex-col  shadow-lg border border-gray-100">
        <header class="flex items-center justify-between pb-4 text-3xl font-semibold text-slate-400 ">
            <h1>My Money</h1>
            <h1>Manisha Solanki</h1>
        </header>

        <!-- cards -->

        <div class="grid grid-cols-3 mt-2 gap-4">
            <div onclick="showAll()" class="bg-gradient-to-l from-orange-800 to-orange-600 m-1 px-2 py-2 rounded-md cursor-pointer">
                <div class="flex flex-col items-start px-2">
                    <h1 class="text-xl text-white font-bold">Balance</h1>
                    <h3 id="Balance" class="text-3xl text-white font-semibold">&#8377;0.00</h3>                    
                </div>
            </div>
            <div onclick="showIncome()" class="bg-gradient-to-l from-teal-800 to-teal-600 m-1 px-2 py-2 rounded-md cursor-pointer">
                <div class="flex flex-col items-start px-2">
                    <h1 class="text-xl text-white font-bold">Income</h1>
                    <h3 id="Income" class="text-3xl text-white font-semibold">&#8377;0.00</h3>                    
                </div>
            </div>
            <div onclick="showExpense()" class="bg-gradient-to-l from-rose-800 to-rose-600 m-1 px-2 py-2 rounded-md cursor-pointer">
                <div class="flex flex-col items-start px-2">
                    <h1 class="text-xl text-white font-bold">Expenses</h1>
                    <h3 id="Expenses" class="text-3xl text-white font-semibold">&#8377;0.00</h3>                    
                </div>
            </div>
        </div>


        <!-- money history -->
        <div class='flex items-center justify-between py-5 px-1'>
            <h2 class="text-xl font-semibold text-blue-500">Money History</h2>
            <button id="button" onClick="toggleAdd()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700">Add New</button>
        </div>

        <div id="form" style="display: none;">
            <div class='p-4 w-full border rounded-lg mb-8 shadow-lg'>
                <h3 class="text-lg font-semibold mb-6 text-center text-blue-600">Add New</h3>
                <form class="flex flex-col space-y-4 items-center px-8">
                    <label class="flex w-full items-center">
                        Remark : 
                        <input id="inputrmk" value type="text" class="mt-1 ml-3 p-2 border flex-1 rounded shadow-sm focus:ring-blue-500 focus:border-blue-500"></input>
                    </label>
                    <label class="flex w-full items-center">
                        Amount : 
                        <input id="inputamt" value type="text" class="mt-1 ml-2 p-2 border flex-1 rounded shadow-sm focus:ring-blue-500 focus:border-blue-500"></input>
                    </label>
                    <label class="flex w-full items-center">
                        Type:
                        <select id="inputtype" class="mt-1 ml-9 p-2 flex-1 border rounded shadow-sm focus:ring-blue-500 focus:border-blue-500" >
                        
                        <option>Income</option>
                        <option>Expense</option>
                        </select>
                    </label>
                    
                    <button onclick="addExpense()" type="button" class="bg-blue-500 hover:bg-blue-700 text-white py-2 px-6 mt-4 rounded transition duration-300 ease-in-out transform hover:-translate-y-1 hover:scale-110">Submit</button>
                </form>
          </div>
        </div>

        <!-- table -->

        <div class="w-full">
            <table class="w-full table-auto">
                <thead class="">
                  <tr class=' bg-slate-100 text-center'>
                    <th class="text-sm font-semibold text-slate-400 p-4">S.No</th>
                    <th class="text-sm font-semibold text-slate-400 p-4">Remark<span onclick="sortRemark()" id="remarkArrow" class="p-2 cursor-pointer">&uarr;</span></th>
                    <th class="text-sm font-semibold text-slate-400 p-4">Amount<span onclick="sortAmount()" id="amountArrow" class="p-2 cursor-pointer">&uarr;</span></th>
                    <th class="text-sm font-semibold text-slate-400 p-4">Type</th>
                    <th class="text-sm font-semibold text-slate-400 p-4 ">Action</th>
                  </tr>
                </thead>
                <tbody id="history">
                    
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>

    
</body>
</html>
